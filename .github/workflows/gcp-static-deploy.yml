# Lives at .github/workflows/gcp-static-deploy.yml (repo root - GitHub Actions
# only ever reads workflows from here, never from a subdirectory like
# code/.github/workflows/, even though the app itself lives under code/).
#
# Deploys the Next.js static export (site + blog) to Firebase Hosting on GCP.
# Runs alongside the existing AWS deploy workflow - AWS is untouched.
#
# Requires two repo VARIABLES (not secrets - these are identifiers, not
# credentials; nothing secret is stored because auth is via Workload
# Identity Federation, no service-account key ever touches this repo):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  <- from infra-gcp-bootstrap's
#                                      `workload_identity_provider` output
#   GCP_DEPLOY_SERVICE_ACCOUNT      <- from infra-gcp-bootstrap's
#                                      `deploy_service_account_email` output
#
# Settings > Secrets and variables > Actions > Variables tab (repo, not
# environment) is where these go.

name: Deploy static site to GCP (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - "code/**"
      - "!code/infra/**"
      - "!code/infra-bootstrap/**"
      - "!code/infra-gcp/**"
      - "!code/infra-gcp-bootstrap/**"
      - "!code/lambda/**"
      - ".github/workflows/gcp-static-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        working-directory: code
        run: npm ci

      - name: Build static export
        working-directory: code
        env:
          # Public Cloudflare Turnstile site key -- same repo Variable the
          # AWS workflow (app-deploy.yml) already uses, just never wired
          # into this one. Without it, NEXT_PUBLIC_TURNSTILE_SITE_KEY is
          # empty at build time and ResumeRequestForm skips rendering the
          # widget entirely (safe by design -- see its NEXT_PUBLIC_ comment)
          # rather than erroring, which is why this was silent.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build

      - id: auth
        name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy to Firebase Hosting
        working-directory: code
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
