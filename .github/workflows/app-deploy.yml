name: Deploy site

# Builds the Next.js static export in code/ and syncs it to the S3 bucket
# CloudFront serves from, then invalidates the CDN cache. Infra changes
# (Route53/ACM/CloudFront config itself) are handled by infra.yml instead —
# this workflow only ever touches the contents of the site bucket.
#
# Requires these repo variables (Settings > Secrets and variables > Actions
# > Variables), set once after the infra bootstrap + first infra deploy —
# see code/infra-bootstrap/README.md:
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION, S3_SITE_BUCKET, CLOUDFRONT_DISTRIBUTION_ID

on:
  push:
    branches: [main]
    paths:
      - "code/app/**"
      - "code/components/**"
      - "code/lib/**"
      - "code/public/**"
      - "code/themes/**"
      - "code/package.json"
      - "code/package-lock.json"
      - "code/next.config.ts"
      - "code/tsconfig.json"
      - "code/postcss.config.mjs"
      - ".github/workflows/app-deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

defaults:
  run:
    working-directory: code

concurrency:
  group: app-deploy-${{ github.workflow }}
  cancel-in-progress: true # a newer push supersedes an in-flight deploy of older content

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync ./out "s3://${{ vars.S3_SITE_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'

      - name: CloudFront not yet configured
        if: vars.CLOUDFRONT_DISTRIBUTION_ID == ''
        run: |
          echo "::notice::Skipped CloudFront invalidation - CLOUDFRONT_DISTRIBUTION_ID repo variable isn't set yet. Set it after infra.yml has created the distribution, so future deploys bust the cache automatically."
